<!doctype html><html lang="en"><script>window.NAMAA_BASE="/namaa-gtm-classroom";window.namaaLocalPath=()=>{const p=location.pathname;return p.startsWith(window.NAMAA_BASE+"/")?p.slice(window.NAMAA_BASE.length):p;};window.namaaHref=p=>typeof p==="string"&&p.startsWith("/")&&!p.startsWith("//")&&!p.startsWith(window.NAMAA_BASE+"/")?window.NAMAA_BASE+p:p;</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Embedded Namaa fit-advice demo</title><style>body{font:14px/1.5 Arial;margin:0;padding:24px;background:#f6faff;color:#173e68}h2{font-size:20px;margin:0 0 8px}p{font-size:12px}select,button{font:13px Arial;padding:11px;border:1px solid #c3d3e5;border-radius:5px}select{background:white;color:#173e68}button{background:#173e68;color:white;cursor:pointer}label{display:block;font-size:12px;margin:15px 0 6px}#result{color:#245b3b}*:focus-visible{outline:3px solid #b93258;outline-offset:3px}</style><h2>A little fit advice</h2><p>Embedded classroom form. No personal details or email are collected.</p><form id="fit-form"><label for="age-group">Which age group?</label><select id="age-group" name="age"><option value="baby">Baby</option><option value="kids">Kids</option></select> <button type="submit">Show fit advice</button></form><p id="result" role="status"></p><script>document.getElementById('fit-form').addEventListener('submit',function(e){e.preventDefault();var age=document.getElementById('age-group').value;document.getElementById('result').textContent=age==='baby'?'Choose by height and leave room for a nappy. Demo advice recorded.':'Check height and chest measurements before choosing. Demo advice recorded.';parent.postMessage({type:'namaa_fit_submit',age_group:age},location.origin);});</script></html>
